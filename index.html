<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #dbeafe, transparent 35%),
        radial-gradient(circle at top right, #fce7f3, transparent 35%),
        #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       GLASS NAVBAR
    ========================== */
    .glass-navbar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 1000px;

      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.55);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);

      border-radius: 20px;
      padding: 10px 18px;

      z-index: 9999;
    }

    .glass-navbar .navbar-nav {
      gap: 10px;
    }

    .glass-navbar .nav-link {
      color: #111;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 18px !important;
      border-radius: 12px;
      transition: 0.25s ease;
    }

    .glass-navbar .nav-link:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    /* =========================
       DROPDOWN
    ========================== */
    .glass-dropdown {
      margin-top: 12px !important;

      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;

      padding: 8px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.1);

      min-width: 190px;
    }

    .glass-dropdown .dropdown-item {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #111;
      transition: 0.2s ease;
    }

    .glass-dropdown .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    /* Mobile */
    @media (max-width: 991px) {
      .glass-navbar {
        width: calc(100% - 24px);
        top: 12px;
      }

      .navbar-collapse {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }

      .glass-dropdown {
        box-shadow: none;
        margin-top: 5px !important;
      }
    }

    /* Demo background */
    .hero-demo {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 20px 40px;
    }

    .hero-demo h1 {
      font-size: clamp(50px, 9vw, 120px);
      font-weight: 700;
      letter-spacing: -5px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg glass-navbar">

    <div class="container-fluid">

      <!-- Mobile Button -->
      <button
        class="navbar-toggler border-0 shadow-none ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#portfolioNavbar"
        aria-controls="portfolioNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation -->
      <div
        class="collapse navbar-collapse justify-content-center"
        id="portfolioNavbar"
      >

        <ul class="navbar-nav align-items-lg-center">

          <!-- Home -->
          <li class="nav-item">
            <a class="nav-link" href="#home">
              Home
            </a>
          </li>

          <!-- Work Dropdown -->
          <li class="nav-item dropdown">

            <a
              class="nav-link dropdown-toggle"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Work
            </a>

            <ul class="dropdown-menu glass-dropdown">

              <li>
                <a class="dropdown-item" href="#graphic">
                  Graphic
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="#video-editor">
                  Video Editor
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="#photographer">
                  Photographer
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="#motion">
                  Motion
                </a>
              </li>

            </ul>

          </li>

          <!-- About -->
          <li class="nav-item">
            <a class="nav-link" href="#about">
              About
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>


  <!-- แค่เอาไว้ให้เห็น Navbar ชัด ๆ -->
  <section class="hero-demo" id="home">
    <h1>PORTFOLIO</h1>
  </section>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
